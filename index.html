<!DOCTYPE html>
<html lang="ja" data-density="standard">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>測定機器台帳</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" onerror="window.__iconLoadFailed = true">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar__title"><i class="fa-solid fa-ruler-combined"></i>測定機器台帳</div>
    <div class="topbar__search">
      <label class="search"><i class="fa-solid fa-magnifying-glass"></i>
        <input class="input" id="q" placeholder="番号・型式・メーカーで探す（/）" autocomplete="off" aria-label="検索">
        <button class="btn btn--ghost btn--icon search__clear" id="qClear" hidden title="検索を消す"><i class="fa-solid fa-xmark"></i></button></label>
      <div class="seg seg--small" id="scope" role="group" aria-label="検索の範囲" hidden></div>
    </div>
    <div class="topbar__spacer"></div>
    <button class="btn btn--primary" id="cta"></button>
  </header>
  <nav class="rail" id="rail" aria-label="設定とデータ"></nav>
  <aside class="sidepanel" id="panel"><div class="sidepanel__inner"></div></aside>
  <div class="workspace">
    <nav class="locnav" id="locnav" aria-label="設置先"></nav>
    <main class="ledger" id="ledger"></main>
    <aside class="drawer" id="detail" aria-label="詳細"></aside>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="js/core/kk.js"></script>
<script src="js/data/db.js"></script>
<script src="js/domain/catalog.js"></script>
<script src="js/domain/rules.js"></script>
<script src="js/data/repo.js"></script>
<script src="js/core/state.js"></script>
<script src="js/data/samples.js"></script>
<script src="js/data/backup.js"></script>
<script src="js/ui/common.js"></script>
<script src="js/ui/locnav.js"></script>
<script src="js/ui/ledger.js"></script>
<script src="js/ui/detail.js"></script>
<script src="js/ui/asset-form.js"></script>
<script src="js/ui/masters.js"></script>
<script src="js/ui/panels.js"></script>
<script src="js/ui/help.js"></script>
<script src="js/app.js"></script>
</body>
</html>
